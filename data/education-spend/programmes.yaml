# Education-spend module — funding programmes with per-stage allocations.
# `approved` / `released` / `spent` are three separate facts, each with its own provenance +
# source, because they come from documents published years apart. A NULL figure + an rti_*
# provenance is the honest placeholder — never a fabricated number.
# Source URLs point to the exact report PDF on cag.gov.in; the specific table/para is in *_source_doc.

